    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputTelefono = document.getElementById('telefono');
            const avisoTelefono = document.getElementById('aviso-telefono');
            let timerAviso = null;

            function mostrarAvisoTelefono() {
                avisoTelefono.style.display = 'block';
                clearTimeout(timerAviso);
                timerAviso = setTimeout(() => {
                    avisoTelefono.style.display = 'none';
                }, 3500);
            }

            // Bloquea teclas extra si ya hay 10 dígitos
            inputTelefono.addEventListener('keydown', (e) => {
                const teclasPermitidas = ['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab', 'Home', 'End'];
                if (teclasPermitidas.includes(e.key) || e.ctrlKey || e.metaKey) return;

                const soloNumeros = inputTelefono.value.replace(/\D/g, '');
                const hayTextoSeleccionado = inputTelefono.selectionStart !== inputTelefono.selectionEnd;

                if (soloNumeros.length >= 10 && !hayTextoSeleccionado) {
                    e.preventDefault();
                    mostrarAvisoTelefono();
                }
            });

            // Filtra letras y corta a 10 dígitos si pegan un número más largo
            inputTelefono.addEventListener('input', () => {
                const limpio = inputTelefono.value.replace(/\D/g, '');
                if (limpio.length > 10) {
                    inputTelefono.value = limpio.slice(0, 10);
                    mostrarAvisoTelefono();
                } else {
                    inputTelefono.value = limpio;
                }
            });

            // Automatización de Código Postal -> Colonia y Municipio
            const inputCP = document.getElementById('codigo_postal');
            const inputColonia = document.getElementById('colonia');
            const listaColonias = document.getElementById('lista-colonias');
            const inputMunicipio = document.getElementById('municipio');
            const estadoCP = document.getElementById('estado-cp');

            inputCP.addEventListener('input', async () => {
                const cp = inputCP.value.replace(/\D/g, '').slice(0, 5);
                inputCP.value = cp;

                if (cp.length < 5) {
                    estadoCP.textContent = '';
                    listaColonias.innerHTML = '';
                    return;
                }

                estadoCP.style.color = '#6b7280';
                estadoCP.textContent = 'Buscando ubicación...';

                try {
                    const respuesta = await fetch(`buscar_cp.php?cp=${cp}`);
                    const datos = await respuesta.json();

                    if (!datos.ok) throw new Error('CP no encontrado');

                    inputMunicipio.value = datos.municipio || '';

                    const colonias = datos.colonias || [];
                    listaColonias.innerHTML = '';
                    colonias.forEach(col => {
                        const option = document.createElement('option');
                        option.value = col;
                        listaColonias.appendChild(option);
                    });

                    inputColonia.value = colonias[0] || '';

                    estadoCP.style.color = '#15803d';
                    estadoCP.textContent = colonias.length > 1
                        ? `✓ ${colonias.length} colonias encontradas (haz clic en Colonia para elegir otra).`
                        : '✓ Ubicación completada automáticamente.';
                } catch (error) {
                    estadoCP.style.color = '#b45309';
                    estadoCP.textContent = 'No se encontró el CP automáticamente; ingrésalo manualmente.';
                }
            });
        });
    </script>
